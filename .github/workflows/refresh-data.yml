name: Refresh Data

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: 'Data source mode (football-data is the default production source; mock is optional/testing only)'
        required: false
        default: 'football-data'
        type: choice
        options:
          - mock
          - football-data
      competition_code:
        description: 'football-data competition code (used only when source_mode=football-data)'
        required: false
        default: 'WC'
      season_year:
        description: 'football-data season year (used only when source_mode=football-data)'
        required: false
        default: '2026'
  schedule:
    # Scheduled production refreshes use football-data by default.
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATA_SOURCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_mode || 'football-data' }}
      FOOTBALL_DATA_COMPETITION_CODE: ${{ github.event.inputs.competition_code || 'WC' }}
      FOOTBALL_DATA_SEASON_YEAR: ${{ github.event.inputs.season_year || '2026' }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh normalized data
        # Scheduled runs use football-data. Manual runs default to football-data; mock must be selected explicitly for testing.
        run: npm run update:data

      - name: Build app
        run: npm run build

      - name: Commit refreshed data if changed
        run: |
          if git diff --quiet -- src/data/normalized; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/normalized
          git commit -m "chore(data): refresh normalized data (${DATA_SOURCE})"
          git push
