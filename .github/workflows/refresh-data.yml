name: Refresh Data

on:
  workflow_dispatch:
    inputs:
      competition_code:
        description: 'football-data competition code'
        required: false
        default: 'WC'
      season_year:
        description: 'football-data season year'
        required: false
        default: '2026'
  schedule:
    # Scheduled production refreshes use football-data.
    - cron: '*/30 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      DATA_SOURCE: football-data
      FOOTBALL_DATA_COMPETITION_CODE: ${{ github.event.inputs.competition_code || 'WC' }}
      FOOTBALL_DATA_SEASON_YEAR: ${{ github.event.inputs.season_year || '2026' }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh normalized data from football-data
        run: npm run update:data:football-data

      - name: Build app
        run: npm run build

      - name: Commit refreshed data if changed
        run: |
          if git diff --quiet -- src/data/normalized; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/normalized
          git commit -m "chore(data): refresh normalized data (${DATA_SOURCE})"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
