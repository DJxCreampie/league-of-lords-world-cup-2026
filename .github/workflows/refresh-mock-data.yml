name: Refresh Mock Data

on:
  workflow_dispatch:
  schedule:
    # Conservative default schedule; adjust later as needed.
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh normalized data (mock source for now)
        # This currently uses local mock API payloads. Later this step will call a real API adapter fetch.
        run: npm run update:data

      - name: Build app
        run: npm run build

      - name: Commit refreshed data if changed
        run: |
          if git diff --quiet -- src/data/normalized; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/normalized
          git commit -m "chore(data): refresh normalized mock data"
          git push
